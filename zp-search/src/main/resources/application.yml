server:
  port: 8083  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: search-service
tj:
  swagger:
    enable: true
    package-path: com.li.zhitu.search.controller
    title: 知途在线学习平台 - 搜索系统接口文档
    description: 该服务包含课程搜索、兴趣推荐等相关功能
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /interests/**
        - /courses/admin
  jdbc:
    database: tj_search
