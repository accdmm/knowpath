server:
  port: 8088  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: trade-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.li.zhitu.trade.controller
    title: 知途在线学习平台 - 交易中心接口文档
    description: 该服务提供购物车、订单管理等功能
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
  jdbc:
    database: tj_trade
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - "/order-details/enrollNum"
