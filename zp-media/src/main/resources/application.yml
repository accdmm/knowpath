server:
  port: 8084  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: media-service
tj:
  swagger:
    enable: true
    package-path: com.li.zhitu.media.controller
    title: 知途在线学习平台 - 媒资中心接口文档
    description: 该服务包含图片管理、媒资管理等
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /medias/signature/play
  jdbc:
    database: tj_media
  platform:
    file: TENCENT
#    file: ALI
    media: TENCENT
  ali:
    accessId: "*******"
    accessKey: "*******"
    oss:
      endpoint: "*******"
      bucket: "*******"
  tencent:
    appId: ${tj.tencent.appId}
    secretId: ${tj.tencent.secretId}
    secretKey: ${tj.tencent.secretKey}
    vod:
      enable: true
      vodValidSeconds: 7776000
      region: "ap-shanghai"
      procedure: "wisehub-base"
      urlKey: "HZFlxjPYoOm5AfShupOx"
      pfcg: "basicDrmPreset"
    cos:
      enable: true
      region: "ap-nanjing"
      bucket: tianji
      multipartUploadThreshold: 5242880 # 5mb，触发分片上传的阈值
      minimumUploadPartSize: 1048576 # 1mb，分片的最小大小
    ai:
      user-id: 9999  #默认id，数据库tj_user中的user表中，有对应的用户数据