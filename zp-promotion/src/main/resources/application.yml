server:
  port: 8092  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: promotion-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.li.zhitu.promotion.controller
    title: 知途在线学习平台 - 促销中心接口文档
    description: 该服务包含优惠促销有关的功能
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
  jdbc:
    database: tj_promotion
  auth:
    resource:
      enable: true # 开启登录拦截的功能
  mq:
    listener:
      retry:
        stateless: false # 无状态
  promotion:
    aes:
      key: knowpath-test-key-in
      iv: knowpath-test-ivinit
