server:
  port: 8082  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: user-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.li.zhitu.user.controller
    title: 知途在线学习平台 - 用户中心接口文档
    description: 该服务用户管理、用户信息管理
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
  auth:
    resource:
      enable: false
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
        - /users/me
  jdbc:
    database: tj_user
