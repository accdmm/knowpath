server:
  port: 8094  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: aigc-service
  main:
    allow-circular-references: true # 允许循环引用
tj:
  swagger:
    enable: true
    package-path: com.li.zhitu.aigc.controller
    title: 知途在线学习平台 - AIGC接口文档
    description: 该服务包含AI相关功能
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
    enableResponseWrap: true
  auth:
    resource:
      enable: true
  jdbc:
    database: tj_aigc #指定使用的数据库名
  ai:
    prompt:
      system:
        chat:
          data-id: system-chat-message.txt
          group: DEFAULT_GROUP
          timeout-ms: 20000
        route-agent:
          data-id: route-agent-system-message.txt
        recommend-agent:
          data-id: recommend-agent-system-message.txt


    memory:
      max: 100 #存储最大的聊天记录数
    chat-type: ROUTE # ROUTE / ENHANCE / APP