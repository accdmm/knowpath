server:
  port: 8085  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: local
  application:
    name: message-service
tj:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.li.zhitu.message.controller
    title: 知途在线学习平台 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: 李梦豪
    contact-url: https://github.com/accdmm/knowpath
    contact-email: 3414724907@qq.com
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
        - /users/detail/{isStaff}
        - /users/list
        - GET:/users/{id}
        - /users/{id}/type
        - /users/ids
  jdbc:
    database: tj_message
  sms:
    ali:
      # 凭据不写进仓库：在 Nacos 配置中心以同名配置项提供
      accessId: "******"
      accessSecret: "******"
